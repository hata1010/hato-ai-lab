{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Gestión Ganadera
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'administrador/css/dashboard.css' %}"
    >

</head>


<body>


<header class="topbar">

    <div class="brand">
        🐄 Gestión Ganadera
    </div>

    <div class="user-area">
        Administrador
    </div>

</header>


<div class="layout">


    <aside class="sidebar">

        <nav>

            <a href="{% url 'administrador:dashboard' %}">
                🏠 Dashboard
            </a>

            <a href="#">
                🐄 Ganado
            </a>

            <a href="#">
                🌱 Potreros
            </a>

            <a href="#">
                ❤️ Salud
            </a>

            <a href="#">
                📦 Recursos
            </a>

            <a href="#">
                🗺️ Mapa
            </a>

        </nav>

    </aside>


    <main class="content">

        {% block content %}
        {% endblock %}

    </main>


</div>


<script
    src="{% static 'administrador/js/dashboard.js' %}">
</script>


</body>

</html>
