<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
    <div>
        <div class="flex items-center gap-3">
            <span class="text-3xl">{{ icono|default:"📋" }}</span>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">{{ titulo }}</h1>
                {% if finca %}<p class="text-sm text-slate-500 mt-1">Finca activa: <strong>{{ finca.nombre }}</strong>{% if rol %} · Rol: <strong>{{ rol }}</strong>{% endif %}</p>{% endif %}
            </div>
        </div>
    </div>
    {% if url_boton %}
    <a href="{{ url_boton }}" class="inline-flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold text-sm transition shadow-sm">{{ boton_texto|default:"Registrar" }}</a>
    {% endif %}
</div>
