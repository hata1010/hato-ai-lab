name: Test Consolidator Input

on:
  push:
    paths:
      - 'tools/consolidator/**'
      - '.github/workflows/test_consolidator_input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Phase 2.1 tests
        run: python -m unittest tools.consolidator.test_input -v
