name: Daily Continuity

on:
  # GitHub Actions cron is evaluated in UTC.
  # Daily production schedule: 12:00 UTC.
  schedule:
    - cron: '0 12 * * *'
  # Manual dispatch is mandatory for immediate testing; never wait for cron.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run integrity check
        run: python tools/integrity_check.py

      - name: Run recovery check
        run: python tools/recovery.py

      - name: Record audit trail
        run: python tools/audit_trail.py

      - name: Run daily continuity commit
        run: python tools/daily_commit.py --push

      - name: Show execution timezone
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Runner: $(date '+%Y-%m-%d %H:%M:%S %Z')"
