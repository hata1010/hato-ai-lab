name: Test Hato AI Architect Authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HATO_AI_ARCHITECT_APP_ID }}
          private-key: ${{ secrets.HATO_AI_ARCHITECT_PRIVATE_KEY }}
          owner: hata1010
          repositories: hato-ai-lab

      - name: Verify authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "AUTHENTICATION: SUCCESS"
          gh api repos/hata1010/hato-ai-lab \
            --jq '"REPOSITORY: " + .full_name'