name: Hato AI Lab Continuity

on:
  workflow_dispatch:

  # GitHub Actions cron is evaluated in UTC.
  # One scheduled execution per day; manual dispatch is the fast test path.
  schedule:
    - cron: '0 4 * * *'

jobs:
  continuity:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HATO_AI_ARCHITECT_APP_ID }}
          private-key: ${{ secrets.HATO_AI_ARCHITECT_PRIVATE_KEY }}
          owner: hata1010
          repositories: hato-ai-lab

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Hato AI Architect"
          git config user.email "hato-ai-architect[bot]@users.noreply.github.com"

      - name: Integrity check
        run: python tools/integrity_check.py

      - name: Recovery check
        run: python tools/recovery.py

      - name: Record audit event
        run: python tools/audit_trail.py --event continuity-check --status PASS --detail "integrity and recovery checks passed"

      - name: Create daily continuity commit
        run: python tools/daily_commit.py --push
