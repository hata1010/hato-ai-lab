name: Test Consolidator Extractor

on:
  push:
    paths:
      - 'tools/consolidator/extractor.py'
      - 'tools/consolidator/test_extractor.py'
      - 'tools/consolidator/input.py'
      - '.github/workflows/test_consolidator_extractor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile consolidator tools
        run: python -m compileall -q tools/consolidator

      - name: Run Phase 2.2 tests
        run: python -m unittest tools.consolidator.test_extractor -v
