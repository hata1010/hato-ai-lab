name: Continuity Validation

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/**'
      - 'docs/memory/**'
      - 'memory/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile continuity tools
        run: python -m compileall -q tools

      - name: Integrity check
        run: python tools/integrity_check.py

      - name: Recovery check
        run: python tools/recovery.py

      - name: Audit trail smoke test
        run: |
          python tools/audit_trail.py --event validation_smoke_test --status PASS --detail "validation workflow"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('memory/audit/continuity.jsonl')
          record = json.loads(path.read_text(encoding='utf-8').splitlines()[-1])
          assert record['event'] == 'validation_smoke_test'
          assert record['status'] == 'PASS'
          assert record['timestamp'].endswith('+00:00')
          print('AUDIT_TRAIL_SMOKE: PASS')
          PY
