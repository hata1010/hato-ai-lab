name: Test Document Pipeline

on:
  push:
    paths:
      - 'tools/document_extractor.py'
      - 'tools/test_document_extractor.py'
      - 'tools/hato_document_integration.py'
      - 'tools/test_hato_document_integration.py'
      - '.github/workflows/test_document_pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-document-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile document tools
        run: python -m compileall -q tools/document_extractor.py tools/hato_document_integration.py

      - name: Run document extractor tests
        run: python -m unittest tools.test_document_extractor tools.test_hato_document_integration -v
